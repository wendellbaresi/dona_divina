<script>
  // --- CONTROLE DE SESSÃO / INATIVIDADE (30 Minutos) E LISTA VIP ---
  let inactivityTimeout;
  const SESSION_LIMIT_MS = 30 * 60 * 1000;

  function resetInactivityTimer() {
    clearTimeout(inactivityTimeout);
    inactivityTimeout = setTimeout(() => {
      showBusinessAlert("Sessão Expirada", "Sua sessão expirou por inatividade (30 minutos). O sistema será atualizado.", "error");
      setTimeout(() => location.reload(), 2000);
    }, SESSION_LIMIT_MS);
  }

  window.onload = initSessionTimer;
  document.addEventListener("mousemove", resetInactivityTimer);
  document.addEventListener("keypress", resetInactivityTimer);
  document.addEventListener("click", resetInactivityTimer);
  document.addEventListener("scroll", resetInactivityTimer);

  function initSessionTimer() {
    resetInactivityTimer();
    checkAdminAccess();
  }

  function checkAdminAccess() {
    google.script.run
      .withSuccessHandler(response => {
        if (!response.isAdmin) {
          document.body.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; background: #F8FAFC; color: #334155;">
              <div style="font-size: 3rem; margin-bottom: 15px;">🔒</div>
              <h2 style="color: #0F172A; margin-bottom: 10px;">Acesso Restrito</h2>
              <p style="color: #64748B;">O e-mail <strong>${response.email}</strong> não está na lista VIP de Administradores.</p>
            </div>
          `;
        }
      })
      .withFailureHandler(err => console.error("Erro ao validar admin:", err))
      .apiCheckAdminPermission();
  }

  // --- REPOSITÓRIO DE CACHE LOCAL (CLIENT-SIDE) ---
  const LocalCache = {
    clientes: null,
    contas: null,
    dashboard: {}, // Guarda por mesAno

    clearAll: function() {
      this.clientes = null;
      this.contas = null;
      this.dashboard = {};
    }
  };

  // --- ESTRUTURA DO CATÁLOGO DE PRODUTOS ---
  const ESTRUTURA_CATALOGO = [
    {
      secao: 'Baguetes',
      icon: '🥖',
      itens: [
        { id: 'bag_comandante', name: 'Baguete do Comandante', type: 'baguete' },
        { id: 'bag_maria', name: 'Baguete Dona Maria', type: 'baguete' },
        { id: 'bag_antonia', name: 'Baguete Dona Antonia', type: 'baguete' },
        { id: 'bag_madalena', name: 'Baguete Dona Madalena', type: 'baguete' },
        { id: 'bag_picanha', name: 'Baguete de Picanha', type: 'baguete_carne'},
        { id: 'bag_cupim', name: 'Baguete de Cupim', type: 'baguete_carne'}
      ]
    },
    {
      secao: 'Espetinhos',
      icon: '🍢',
      itens: [
        { id: 'esp_frango', name: 'Espetinho de Frango', price: 11.00, icon: '🍢' },
        { id: 'esp_frango_bacon', name: 'Frango e Bacon', price: 11.00, icon: '🍢' },
        { id: 'esp_contra', name: 'Contra-filé', price: 11.00, icon: '🍢' },
        { id: 'esp_kafta', name: 'Kafta', price: 11.00, icon: '🍢' },
        { id: 'esp_coracao', name: 'Coração', price: 11.00, icon: '🍢' },
        { id: 'esp_alcatra', name: 'Alcatra', price: 11.00, icon: '🍢' },
        { id: 'esp_queijo', name: 'Queijo Coalho', price: 11.00, icon: '🍢' },
        { id: 'esp_linguica_ap', name: 'Linguiça Apimentada', price: 11.00, icon: '🍢' },
        { id: 'esp_linguica_to', name: 'Linguiça Toscana', price: 11.00, icon: '🍢' },
        { id: 'esp_calabresa', name: 'Calabresa', price: 11.00, icon: '🍢' }
      ]
    },
    {
      secao: 'Almoço (Pratos do Dia)',
      icon: '🍽️',
      itens: [
        { id: 'alm_carne_cozida', name: 'Carne Cozida', price: 25.00, icon: '🍛' },
        { id: 'alm_peito_frango', name: 'Peito de Frango', price: 20.00, icon: '🍛' },
        { id: 'alm_pernil', name: 'Pernil', price: 27.00, icon: '🍛' },
        { id: 'alm_bife', name: 'Bife', price: 20.00, icon: '🍛' },
        { id: 'alm_bife_especial', name: 'Bife Especial', price: 25.00, icon: '🍛' },
        { id: 'alm_parm_frango', name: 'Parmegiana de Frango', price: 27.00, icon: '🍛' },
        { id: 'alm_parm_carne', name: 'Parmegiana de Carne', price: 35.00, icon: '🍛' }
      ]
    },
    {
      secao: 'Bebidas',
      icon: '🥤',
      itens: [
        { id: 'beb_agua', name: 'Água', price: 3.00, icon: '💧' },
        { id: 'beb_agua_gas', name: 'Água c/ Gás', price: 4.00, icon: '💧' },
        { id: 'beb_refri', name: 'Refrigerante', price: 6.00, icon: '🥤' },
        { id: 'beb_suco', name: 'Suco Natural', price: 6.00, icon: '🧃' },
        { id: 'beb_heineken', name: 'Cerveja Heineken', price: 10.00, icon: '🍺' }
      ]
    }
  ];

  let cart = []; 
  let tempSelectedItem = null;
  let comandaEmAdicao = null; // { id, nome, mesa }
  let editingId = null;
  let deletingId = null;

  // --- ROUTER (SPA) ---
  const Router = {
    navigateTo: function(viewName, event) {
      if (event) event.preventDefault();

      document.querySelectorAll(".menu a").forEach(el => el.classList.remove("active"));
      if (event && event.currentTarget) {
        event.currentTarget.classList.add("active");
      }

      document.querySelectorAll(".page-view").forEach(view => view.style.display = "none");

      const titles = {
        'produtos': 'Catálogo de Produtos / Vendas',
        'clientes': 'Controle de Clientes e Comandas',
        'entradas': 'Controle de Entradas',
        'saidas': 'Controle de Saídas',
        'contas': 'Contas da Loja',
        'dashboard': 'Visão Geral do Caixa'
      };

      document.getElementById("pageTitle").innerText = titles[viewName] || 'Painel';
      const targetView = document.getElementById(`view-${viewName}`);
      if (targetView) targetView.style.display = "block";

      if (viewName === 'produtos') {
        ProdutosController.render();
      } else if (viewName === 'clientes') {
        ClientesController.load();
      } else if (viewName === 'contas') {
        ContasController.load();
      } else {
        FinanceStore.loadData();
      }
    }
  };

  const FinanceStore = {
    loadData: function(forcarAtualizacao = false) {
      const selectMes = document.getElementById("selectMesReferencia");
      const mesFiltro = selectMes ? selectMes.value : "atual";

      if (!forcarAtualizacao && LocalCache.dashboard[mesFiltro]) {
        const cachedData = LocalCache.dashboard[mesFiltro];
        DashboardController.render(cachedData);
        EntradasController.render(cachedData);
        SaidasController.render(cachedData);
        return;
      }

      google.script.run
        .withSuccessHandler(response => {
          const data = JSON.parse(response);
          LocalCache.dashboard[mesFiltro] = data;
          DashboardController.render(data);
          EntradasController.render(data);
          SaidasController.render(data);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao carregar dados: " + (err.message || err), "error"))
        .apiGetDashboardData(selectMes ? selectMes.value : null);
    }
  };

  // --- CONTROLADOR DE PRODUTOS ---
  const ProdutosController = {
    render: function() {
      this.filter();
    },

    filter: function() {
      const term = (document.getElementById("searchProduto")?.value || "").toLowerCase();
      const container = document.getElementById("productsGrid");
      if (!container) return;

      container.innerHTML = "";

      if (comandaEmAdicao) {
        const banner = document.createElement("div");
        banner.style.cssText = "grid-column: 1 / -1; background: #FEF3C7; border: 1px solid #F59E0B; color: #92400E; padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;";
        banner.innerHTML = `
          <div><strong>➕ Adicionando itens à comanda:</strong> ${comandaEmAdicao.nome} (${comandaEmAdicao.mesa})</div>
          <button onclick="cancelarAdicaoComanda()" style="background: #DC2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cancelar</button>
        `;
        container.appendChild(banner);
      }

      ESTRUTURA_CATALOGO.forEach(secao => {
        const itensFiltrados = secao.itens.filter(i => i.name.toLowerCase().includes(term));
        if (itensFiltrados.length === 0) return;

        const secaoHeader = document.createElement("div");
        secaoHeader.style.cssText = "grid-column: 1 / -1; margin-top: 15px; margin-bottom: 10px; border-bottom: 2px solid #E2E8F0; padding-bottom: 6px;";
        secaoHeader.innerHTML = `<h3 style="color: #0F172A; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;"><span>${secao.icon}</span> ${secao.secao}</h3>`;
        container.appendChild(secaoHeader);

        const gridSecao = document.createElement("div");
        gridSecao.style.cssText = "display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; grid-column: 1 / -1; margin-bottom: 20px;";

        itensFiltrados.forEach(prod => {
          const card = document.createElement("div");
          card.className = "card";
          card.style.cssText = "padding: 16px; text-align: center; border-radius: 12px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between;";

          let precoTexto = "";
          if (prod.type === 'baguete') precoTexto = 'R$ 24,00 / R$ 34,00';
          else if (prod.type === 'baguete_carne') precoTexto = 'R$ 35,00 / R$ 45,00';
          else precoTexto = formatCurrency(prod.price);

          const iconExibido = prod.icon || secao.icon;

          const qtyTotal = cart.reduce((acc, curr) => {
            return curr.baseId === prod.id ? acc + curr.qty : acc;
          }, 0);

          card.innerHTML = `
            <div>
              <div style="font-size: 2.5rem; margin-bottom: 8px;">${iconExibido}</div>
              <div style="font-weight: bold; color: #0F172A; margin-bottom: 6px; font-size: 0.95rem;">${prod.name}</div>
            </div>
            <div>
              <div style="font-size: 0.85rem; font-weight: bold; color: #A82329; margin-bottom: 12px;">${precoTexto}</div>
              
              <div id="action-area-${prod.id}">
                ${qtyTotal > 0 ? `
                  <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <button onclick='ProdutosController.removeOne("${prod.id}")' class="btn-action" style="width: 32px; height: 32px; font-weight: bold; background: #F1F5F9; border-radius: 6px; border: 1px solid #CBD5E1;">-</button>
                    <span style="font-weight: bold; min-width: 20px;">${qtyTotal}</span>
                    <button id="btn-add-${prod.id}" class="btn-action" style="width: 32px; height: 32px; font-weight: bold; background: #A82329; color: white; border: none; border-radius: 6px;">+</button>
                  </div>
                ` : `
                  <button id="btn-add-${prod.id}" class="btn btn-primary" style="width: 100%; background: #A82329; border: none; padding: 8px; font-weight: bold; font-size: 0.85rem;">+ Adicionar</button>
                `}
              </div>
            </div>
          `;
          gridSecao.appendChild(card);

          setTimeout(() => {
            const btnAdd = document.getElementById(`btn-add-${prod.id}`);
            if (btnAdd) {
              btnAdd.onclick = () => ProdutosController.handleItemClick(prod);
            }
          }, 0);
        });

        container.appendChild(gridSecao);
      });

      this.updateCartBar();
    },

    handleItemClick: function(prod) {
      tempSelectedItem = prod;
      if (prod.type === 'baguete' || prod.type === 'baguete_carne') {
        const modalNome = document.getElementById("modalBagueteNome");
        const modalEl = document.getElementById("modalBagueteOpcoes");
        const txtSimples = document.getElementById("precoBagueteSimples");
        const txtDupla = document.getElementById("precoBagueteDupla");

        if (modalNome) modalNome.innerText = prod.name;
        
        if (prod.type === 'baguete_carne') {
          if (txtSimples) txtSimples.innerText = "R$ 35,00";
          if (txtDupla) txtDupla.innerText = "R$ 45,00";
        } else {
          if (txtSimples) txtSimples.innerText = "R$ 24,00";
          if (txtDupla) txtDupla.innerText = "R$ 34,00";
        }

        if (modalEl) modalEl.style.display = "flex";
      } else {
        this.addItemToCart(prod.id, prod.name, prod.price);
      }
    },

    addItemToCart: function(baseId, nomeItem, preco) {
      const idx = cart.findIndex(i => i.name === nomeItem && i.baseId === baseId);
      if (idx >= 0) {
        cart[idx].qty += 1;
      } else {
        cart.push({ baseId: baseId, name: nomeItem, price: preco, qty: 1 });
      }
      this.filter();
    },

    removeOne: function(baseId) {
      const indices = [];
      cart.forEach((item, idx) => {
        if (item.baseId === baseId) indices.push(idx);
      });

      if (indices.length > 0) {
        const lastIdx = indices[indices.length - 1];
        cart[lastIdx].qty -= 1;
        if (cart[lastIdx].qty <= 0) {
          cart.splice(lastIdx, 1);
        }
      }
      this.filter();
    },

    updateCartBar: function() {
      let totalCount = 0;
      let totalPrice = 0;

      cart.forEach(item => {
        totalCount += item.qty;
        totalPrice += (item.price * item.qty);
      });

      const countEl = document.getElementById("cartCount");
      const totalEl = document.getElementById("cartTotal");
      if (countEl) countEl.innerText = totalCount;
      if (totalEl) totalEl.innerText = formatCurrency(totalPrice);
    },

    checkout: function() {
      let totalPrice = 0;
      cart.forEach(item => totalPrice += (item.price * item.qty));

      if (totalPrice === 0) {
        showBusinessAlert("Atenção", "Selecione pelo menos um produto para continuar.", "error");
        return;
      }

      if (comandaEmAdicao) {
        document.getElementById("inputNomeCliente").value = comandaEmAdicao.nome;
        document.getElementById("inputNomeCliente").disabled = true;
        if (document.getElementById("inputNumeroMesa")) {
          document.getElementById("inputNumeroMesa").value = comandaEmAdicao.mesa;
          document.getElementById("inputNumeroMesa").disabled = true;
        }
        document.getElementById("selectStatusPagamento").value = "EM DÍVIDA";
        document.getElementById("modalCheckout").style.display = "flex";
        return;
      }

      document.getElementById("inputNomeCliente").value = "";
      document.getElementById("inputNomeCliente").disabled = false;
      if (document.getElementById("inputNumeroMesa")) {
        document.getElementById("inputNumeroMesa").value = "";
        document.getElementById("inputNumeroMesa").disabled = false;
      }
      document.getElementById("modalCheckout").style.display = "flex";
      document.getElementById("inputNomeCliente").focus();
    }
  };

  function cancelarAdicaoComanda() {
    comandaEmAdicao = null;
    cart = [];
    Router.navigateTo('clientes');
  }

  // --- ENVIAR PARA COZINHA (IMPRESSÃO TÉRMICA) ---
  function enviarParaCozinha(nomeCliente, mesa, itensArray) {
    const janelaCozinha = window.open('', '_blank', 'width=380,height=550');
    if (!janelaCozinha) return;

    janelaCozinha.document.write(`
      <html>
        <head>
          <title>Comanda Cozinha</title>
          <style>
            body { font-family: 'Courier New', monospace; padding: 12px; width: 280px; color: #000; margin: 0; }
            h2 { text-align: center; margin: 0 0 8px 0; font-size: 1.1rem; border-bottom: 2px solid #000; padding-bottom: 4px; }
            .info { font-size: 0.9rem; margin-bottom: 10px; line-height: 1.4; }
            hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
            ul { padding-left: 16px; font-size: 1rem; margin: 8px 0; }
            li { margin-bottom: 6px; font-weight: bold; }
          </style>
        </head>
        <body>
          <h2>CHURRASQUINHO DONA DIVINA</h2>
          <div class="info">
            <strong>CLIENTE:</strong> ${nomeCliente}<br>
            <strong>MESA:</strong> ${mesa || 'Balcão'}<br>
            <strong>HORA:</strong> ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
          </div>
          <hr>
          <div style="font-weight: bold; font-size: 0.9rem;">PEDIDO PARA PREPARO:</div>
          <ul>
            ${itensArray.map(i => `<li>${i}</li>`).join('')}
          </ul>
          <hr>
          <script>
            window.onload = function() {
              window.print();
              setTimeout(() => window.close(), 600);
            }
          <\/script>
        </body>
      </html>
    `);
    janelaCozinha.document.close();
  }

  // --- MODAL DE BAGUETES ---
  function selectBagueteTamanho(tamanho) {
    if (!tempSelectedItem) return;
    let preco = 24.00;
    if (tempSelectedItem.type === 'baguete_carne') {
      preco = tamanho === 'Simples' ? 35.00 : 45.00;
    } else {
      preco = tamanho === 'Simples' ? 24.00 : 34.00;
    }

    const nomeCompleto = `${tempSelectedItem.name} (${tamanho})`;
    ProdutosController.addItemToCart(tempSelectedItem.id, nomeCompleto, preco);
    closeOptionModals();
  }

  function closeOptionModals() {
    const modalBag = document.getElementById("modalBagueteOpcoes");
    if (modalBag) modalBag.style.display = "none";
    tempSelectedItem = null;
  }

  // --- CONTROLADOR DE CLIENTES E COMANDAS (COM CACHE) ---
  let clienteIdParaExcluir = null;

  const ClientesController = {
    load: function(forcarAtualizacao = false) {
      const tbody = document.getElementById("clientesTableBody");
      const inputData = document.getElementById("filtroDataClientes");
      
      if (inputData && !inputData.value && !forcarAtualizacao) {
        const hojeLocal = new Date().toISOString().split('T')[0];
        inputData.value = hojeLocal;
      }
      const dataFiltro = inputData ? inputData.value : "";

      // Se já estiver em cache no navegador e não pediu atualização forçada, renderiza na hora!
      if (!forcarAtualizacao && LocalCache.clientes) {
        this.render(LocalCache.clientes, dataFiltro);
        return;
      }

      if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Carregando clientes da planilha...</td></tr>`;

      google.script.run
        .withSuccessHandler(response => {
          LocalCache.clientes = JSON.parse(response);
          this.render(LocalCache.clientes, dataFiltro);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao carregar clientes: " + err.message, "error"))
        .apiGetClientesData();
    },

    limparFiltroData: function() {
      const inputData = document.getElementById("filtroDataClientes");
      if (inputData) inputData.value = "";
      this.render(LocalCache.clientes || [], "");
    },

    render: function(clientes, dataFiltro) {
      const tbody = document.getElementById("clientesTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";

      let clientesFiltrados = clientes;
      if (dataFiltro) {
        clientesFiltrados = clientes.filter(c => {
          const dataItem = String(c.date).split('T')[0];
          return dataItem === dataFiltro;
        });
      }

      if (!clientesFiltrados || clientesFiltrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Nenhum registro encontrado para esta data.</td></tr>`;
        return;
      }

      clientesFiltrados.forEach(c => {
        const isAberto = c.status === 'EM DÍVIDA';
        const badgeColor = isAberto ? '#E74C3C' : '#2ECC71';
        const statusLabel = isAberto ? 'EM ABERTO' : 'PAGO';
        const mesaTag = c.mesa ? `<span style="background: #E2E8F0; color: #1E293B; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 6px;">${c.mesa}</span>` : '';

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${c.nome}</strong>${mesaTag}</td>
          <td>${formatDate(c.date)}</td>
          <td>${c.descricao}</td>
          <td><strong>${formatCurrency(c.amount)}</strong></td>
          <td><strong style="color: ${badgeColor}">${statusLabel}</strong></td>
          <td style="text-align: center;">
            <div style="display: inline-flex; gap: 4px; align-items: center; justify-content: center; white-space: nowrap;">
              ${isAberto ? `
                <button class="btn btn-primary" style="padding: 4px 6px; font-size: 0.7rem; background: #3B82F6; border: none;" onclick="ClientesController.adicionarMais('${c.id}', '${c.nome}', '${c.mesa}')" title="Adicionar mais pedidos">+ Itens</button>
                <button class="btn btn-primary" style="padding: 4px 6px; font-size: 0.7rem; background: #2ECC71; border: none;" onclick="ClientesController.pagar('${c.id}')">Quitar</button>
              ` : '<span style="font-size: 0.75rem; color: #2ECC71; font-weight: bold;">Quitado</span>'}
              
              <button class="btn-action" style="padding: 3px 6px; font-size: 0.75rem; background: #F1F5F9; border: 1px solid #CBD5E1; cursor: pointer; border-radius: 4px;" onclick="ClientesController.reimprimirCozinha('${c.nome}', '${c.mesa}', '${c.descricao}')" title="Enviar para a Cozinha">🖨️</button>
              
              <button class="btn-action btn-delete" style="padding: 3px 6px; font-size: 0.75rem; cursor: pointer; border-radius: 4px;" onclick="ClientesController.promptRemover('${c.id}')" title="Excluir Registro">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    },

    adicionarMais: function(id, nome, mesa) {
      comandaEmAdicao = { id, nome, mesa };
      cart = [];
      Router.navigateTo('produtos');
    },

    reimprimirCozinha: function(nome, mesa, descricao) {
      const itens = descricao.split(',').map(i => i.trim());
      enviarParaCozinha(nome, mesa, itens);
    },

    pagar: function(id) {
      google.script.run
        .withSuccessHandler(() => {
          LocalCache.clearAll(); // Invalida o cache para buscar dados atualizados
          showBusinessAlert("Conta Quitada", "Conta quitada com sucesso e receita lançada no caixa!", "success");
          ClientesController.load(true);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao quitar conta: " + err.message, "error"))
        .apiPagarCliente(id);
    },

    promptRemover: function(id) {
      clienteIdParaExcluir = id;
      document.getElementById("modalDeleteCliente").style.display = "flex";
    }
  };

  function closeDeleteClienteModal() {
    clienteIdParaExcluir = null;
    document.getElementById("modalDeleteCliente").style.display = "none";
  }

  function confirmDeleteCliente() {
    if (!clienteIdParaExcluir) return;
    const id = clienteIdParaExcluir;
    closeDeleteClienteModal();

    google.script.run
      .withSuccessHandler(() => {
        LocalCache.clearAll();
        showBusinessAlert("Registro Excluído", "O registro foi removido com sucesso.", "success");
        ClientesController.load(true);
      })
      .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao excluir cliente: " + err.message, "error"))
      .apiDeleteCliente(id);
  }

  // --- CONTROLADOR DE CONTAS DA LOJA (COM CACHE) ---
  const ContasController = {
    load: function(forcarAtualizacao = false) {
      const selectMes = document.getElementById("selectMesContas");
      const mesFiltro = selectMes ? selectMes.value : null;

      if (!forcarAtualizacao && LocalCache.contas) {
        this.render(LocalCache.contas, mesFiltro);
        this.loadMesesSelect(LocalCache.contas);
        return;
      }

      google.script.run
        .withSuccessHandler(response => {
          LocalCache.contas = JSON.parse(response);
          this.loadMesesSelect(LocalCache.contas);
          const mesAtualSelect = selectMes ? selectMes.value : null;
          this.render(LocalCache.contas, mesAtualSelect);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao carregar contas da loja: " + err.message, "error"))
        .apiGetContasData(null);
    },

    loadMesesSelect: function(contas) {
      const select = document.getElementById("selectMesContas");
      if (!select || (select.options.length > 1 && select.value !== "")) return;

      const monthsSet = new Set();
      contas.forEach(item => {
        if (item.date) {
          monthsSet.add(item.date.slice(0, 7));
        }
      });

      const sortedMonths = Array.from(monthsSet).sort().reverse();
      select.innerHTML = `<option value="">Todos os Meses</option>`;

      sortedMonths.forEach(m => {
        const option = document.createElement("option");
        option.value = m;
        option.textContent = formatMonthLabel(m);
        select.appendChild(option);
      });
    },

    render: function(contasItems, mesFiltro) {
      const tbody = document.getElementById("contasTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";

      let filtradas = contasItems || [];
      if (mesFiltro) {
        filtradas = filtradas.filter(item => item.date && item.date.slice(0, 7) === mesFiltro);
      }

      if (filtradas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Nenhuma conta fixa registrada para este período.</td></tr>`;
        return;
      }

      filtradas.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(item.date)}</td>
          <td><span style="background: #F1F5F9; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85rem;">${item.category}</span></td>
          <td>${item.description}</td>
          <td><strong style="color: #E74C3C;">${formatCurrency(item.amount)}</strong></td>
          <td style="text-align: center;">
            <div style="display: inline-flex; gap: 4px; justify-content: center;">
              <button class="btn-action btn-edit" onclick='openEditContaModal(${JSON.stringify(item)})' title="Editar Conta" style="padding: 3px 6px; font-size: 0.75rem; background: #F1F5F9; border: 1px solid #CBD5E1; border-radius: 4px; cursor: pointer;">✏️</button>
              <button class="btn-action btn-delete" onclick="promptDeleteConta('${item.id}')" title="Excluir Conta" style="padding: 3px 6px; font-size: 0.75rem; cursor: pointer; border-radius: 4px;">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  };

  let editingContaId = null;

  function openModalConta() {
    editingContaId = null;
    document.getElementById("modalContaTitle").innerText = "Nova Conta da Loja";
    document.getElementById("contaForm").reset();
    document.getElementById("contaId").value = "";
    document.getElementById("modalConta").style.display = "flex";
    document.getElementById("contaCategory").focus();
  }

  function openEditContaModal(item) {
    editingContaId = item.id;
    document.getElementById("modalContaTitle").innerText = "Editar Conta da Loja";
    document.getElementById("contaId").value = item.id;
    document.getElementById("contaCategory").value = item.category;
    document.getElementById("contaDescription").value = item.description;
    document.getElementById("contaAmount").value = item.amount;
    document.getElementById("modalConta").style.display = "flex";
  }

  function closeContaModal() {
    document.getElementById("modalConta").style.display = "none";
    editingContaId = null;
  }

  function handleContaSubmit(event) {
    event.preventDefault();
    const payload = {
      type: "SAIDA",
      category: document.getElementById("contaCategory").value.trim(),
      description: document.getElementById("contaDescription").value.trim(),
      amount: parseFloat(document.getElementById("contaAmount").value),
      date: new Date().toISOString().split('T')[0]
    };

    closeContaModal();

    if (editingContaId) {
      google.script.run
        .withSuccessHandler(() => {
          LocalCache.clearAll();
          showBusinessAlert("Sucesso", "Conta da loja atualizada com sucesso!", "success");
          ContasController.load(true);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao atualizar conta: " + err.message, "error"))
        .apiUpdateTransaction(editingContaId, payload);
    } else {
      google.script.run
        .withSuccessHandler(() => {
          LocalCache.clearAll();
          showBusinessAlert("Sucesso", "Nova conta cadastrada com sucesso!", "success");
          ContasController.load(true);
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao salvar conta: " + err.message, "error"))
        .apiSaveContaTransaction(payload);
    }
  }

  function promptDeleteConta(id) {
    deletingId = id;
    document.getElementById("modalDelete").style.display = "flex";
  }

  // --- ALERTAS EMPRESARIAIS ---
  function showBusinessAlert(title, message, type = 'success') {
    const iconEl = document.getElementById("modalAlertIcon");
    const titleEl = document.getElementById("modalAlertTitle");
    const msgEl = document.getElementById("modalAlertMessage");
    const modalEl = document.getElementById("modalAlert");

    if (iconEl) iconEl.innerText = type === 'success' ? '✅' : '⚠️';
    if (titleEl) titleEl.innerText = title;
    if (msgEl) msgEl.innerText = message;
    if (modalEl) modalEl.style.display = "flex";
  }

  function closeAlertModal() {
    const modalEl = document.getElementById("modalAlert");
    if (modalEl) modalEl.style.display = "none";
  }

  // --- CHECKOUT E ADIÇÃO (SALVANDO NA PLANILHA) ---
  function closeCheckoutModal() {
    document.getElementById("modalCheckout").style.display = "none";
    document.getElementById("inputNomeCliente").disabled = false;
    if (document.getElementById("inputNumeroMesa")) {
      document.getElementById("inputNumeroMesa").disabled = false;
    }
  }

  function confirmCheckout() {
    const nomeCliente = document.getElementById("inputNomeCliente").value.trim();
    const numeroMesa = document.getElementById("inputNumeroMesa") ? document.getElementById("inputNumeroMesa").value.trim() : "Balcão";
    const statusPagamento = document.getElementById("selectStatusPagamento").value;
    const deveImprimirCozinha = document.getElementById("checkEnviarCozinha").checked;

    if (!nomeCliente) {
      showBusinessAlert("Atenção", "Por favor, informe o nome do cliente.", "error");
      return;
    }

    let totalPrice = 0;
    let itemsList = [];

    cart.forEach(item => {
      totalPrice += (item.price * item.qty);
      itemsList.push(`${item.qty}x ${item.name}`);
    });

    closeCheckoutModal();

    if (comandaEmAdicao) {
      const idComanda = comandaEmAdicao.id;
      const nomeComanda = comandaEmAdicao.nome;
      const mesaComanda = comandaEmAdicao.mesa;

      google.script.run
        .withSuccessHandler(() => {
          LocalCache.clearAll();
          if (deveImprimirCozinha) {
            enviarParaCozinha(nomeComanda, mesaComanda, itemsList);
          }

          showBusinessAlert("Itens Adicionados", `Novos itens adicionados à comanda de ${nomeComanda}!`, "success");
          comandaEmAdicao = null;
          cart = [];
          Router.navigateTo('clientes');
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao adicionar itens: " + err.message, "error"))
        .apiAdicionarItensCliente(idComanda, itemsList.join(", "), totalPrice);
      return;
    }

    const payloadCliente = {
      nome: nomeCliente,
      mesa: numeroMesa || "Balcão",
      descricao: itemsList.join(", "),
      amount: totalPrice,
      date: new Date().toISOString().split('T')[0],
      status: statusPagamento
    };

    google.script.run
      .withSuccessHandler(() => {
        LocalCache.clearAll();
        if (deveImprimirCozinha) {
          enviarParaCozinha(payloadCliente.nome, payloadCliente.mesa, itemsList);
        }

        if (statusPagamento === "PAGO") {
          const payloadVenda = {
            type: "ENTRADA",
            category: "Venda Presencial",
            description: `${payloadCliente.nome} (${payloadCliente.mesa}): ${payloadCliente.descricao}`,
            amount: totalPrice,
            date: payloadCliente.date
          };

          google.script.run
            .withSuccessHandler(() => {
              showBusinessAlert("Venda Concluída", "Venda concluída e lançada no caixa!", "success");
              cart = [];
              ProdutosController.render();
            })
            .apiSaveTransaction(payloadVenda);
        } else {
          showBusinessAlert("Comanda Aberta", "Pedido salvo em aberto com sucesso!", "success");
          cart = [];
          ProdutosController.render();
        }
      })
      .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao registrar pedido: " + err.message, "error"))
      .apiSaveCliente(payloadCliente);
  }

  // --- FECHAMENTO DE CAIXA DO DIA ---
  function abrirFechamentoCaixa() {
    const hoje = new Date().toISOString().split('T')[0];
    google.script.run
      .withSuccessHandler(response => {
        const res = JSON.parse(response);
        showBusinessAlert(
          `Fechamento do Dia (${formatDate(res.data)})`,
          `Total de vendas pagas hoje: ${formatCurrency(res.totalEntradas)}`,
          "success"
        );
      })
      .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao calcular fechamento: " + err.message, "error"))
      .apiGetFechamentoCaixaDiario(hoje);
  }

  // --- DEMAIS CONTROLADORES ---
  const DashboardController = {
    reload: function() { FinanceStore.loadData(true); },
    render: function(data) {
      document.getElementById("totalEntradas").innerText = formatCurrency(data.totalEntradas);
      document.getElementById("totalSaidas").innerText = formatCurrency(data.totalSaidas);
      document.getElementById("saldoAtual").innerText = formatCurrency(data.saldoAtual);

      const tbody = document.getElementById("transactionTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";

      if (!data.recentTransactions || data.recentTransactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Nenhum lançamento encontrado.</td></tr>`;
        return;
      }

      data.recentTransactions.slice(0, 7).forEach(item => {
        const isEntrada = item.type === "ENTRADA";
        const badgeColor = isEntrada ? "#2ECC71" : "#E74C3C";
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(item.date)}</td>
          <td><strong style="color: ${badgeColor}">${item.type}</strong></td>
          <td>${item.category}</td>
          <td>${item.description}</td>
          <td><strong>${formatCurrency(item.amount)}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }
  };

  const EntradasController = {
    render: function(data) {
      const tbody = document.getElementById("entradasTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";
      const entradasItems = data.recentTransactions.filter(item => item.type === "ENTRADA");

      if (entradasItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Nenhuma entrada registrada neste mês.</td></tr>`;
        return;
      }

      entradasItems.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(item.date)}</td>
          <td><strong style="color: #2ECC71">ENTRADA</strong></td>
          <td>${item.category}</td>
          <td>${item.description}</td>
          <td><strong style="color: #2ECC71">${formatCurrency(item.amount)}</strong></td>
          <td style="text-align: center;">
            <button class="btn-action btn-edit" onclick='openEditModal(${JSON.stringify(item)})' title="Editar">✏️ Editar</button>
            <button class="btn-action btn-delete" onclick="promptDelete('${item.id}')" title="Excluir">🗑️ Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  };

  const SaidasController = {
    render: function(data) {
      const tbody = document.getElementById("saidasTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";
      const saidasItems = data.recentTransactions.filter(item => item.type === "SAIDA");

      if (saidasItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Nenhuma saída registrada neste mês.</td></tr>`;
        return;
      }

      saidasItems.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(item.date)}</td>
          <td><strong style="color: #E74C3C">SAÍDA</strong></td>
          <td>${item.category}</td>
          <td>${item.description}</td>
          <td><strong style="color: #E74C3C">${formatCurrency(item.amount)}</strong></td>
          <td style="text-align: center;">
            <button class="btn-action btn-edit" onclick='openEditModal(${JSON.stringify(item)})' title="Editar">✏️ Editar</button>
            <button class="btn-action btn-delete" onclick="promptDelete('${item.id}')" title="Excluir">🗑️ Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

  };

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".page-view").forEach(view => view.style.display = "none");
    const produtosView = document.getElementById("view-produtos");
    if (produtosView) produtosView.style.display = "block";
    
    ProdutosController.render();
    loadAvailableMonths();
  });

  function loadAvailableMonths() {
    google.script.run
      .withSuccessHandler(months => {
        const select = document.getElementById("selectMesReferencia");
        if (!select) return;
        select.innerHTML = "";
        if (!months || months.length === 0) {
          select.innerHTML = `<option value="">Nenhum mês encontrado</option>`;
          return;
        }
        months.forEach(m => {
          const option = document.createElement("option");
          option.value = m;
          option.textContent = formatMonthLabel(m);
          select.appendChild(option);
        });
        select.value = months[0];
      })
      .withFailureHandler(err => console.error("Erro ao carregar meses:", err))
      .apiGetAvailableMonths();
  }

  function formatMonthLabel(yyyyMm) {
    const [ano, mes] = yyyyMm.split('-');
    const mesesNomes = {
      '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril',
      '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto',
      '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro'
    };
    return `${mesesNomes[mes] || mes} de ${ano}`;
  }

  function formatDate(dateString) {
    if (!dateString) return '';
    let limpaStr = String(dateString).split('T')[0];
    const parts = limpaStr.split('-');
    
    if (parts.length === 3) {
      if (parts[0].length === 4) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
    }
    
    const d = new Date(dateString);
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
    }
    
    return dateString;
  }

  function formatCurrency(val) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
  }

  function openModal() {
    editingId = null;
    const titleEl = document.getElementById("modalTitle");
    if (titleEl) titleEl.innerText = "Novo Lançamento";
    const form = document.getElementById("financeForm");
    if (form) form.reset();
    document.getElementById("modalTransaction").style.display = "flex";
  }

  function openEditModal(item) {
    editingId = item.id;
    const titleEl = document.getElementById("modalTitle");
    if (titleEl) titleEl.innerText = "Editar Lançamento";
    document.getElementById("type").value = item.type;
    document.getElementById("category").value = item.category;
    document.getElementById("description").value = item.description;
    document.getElementById("amount").value = item.amount;
    document.getElementById("modalTransaction").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modalTransaction").style.display = "none";
    editingId = null;
  }

  function handleFormSubmit(event) {
    event.preventDefault();
    const payload = {
      type: document.getElementById("type").value,
      category: document.getElementById("category").value,
      description: document.getElementById("description").value,
      amount: parseFloat(document.getElementById("amount").value),
      date: new Date().toISOString().split('T')[0]
    };

    if (editingId) {
      google.script.run
        .withSuccessHandler(() => { 
          LocalCache.clearAll();
          closeModal(); 
          FinanceStore.loadData(true); 
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao atualizar: " + (err.message || err), "error"))
        .apiUpdateTransaction(editingId, payload);
    } else {
      google.script.run
        .withSuccessHandler(() => { 
          LocalCache.clearAll();
          closeModal(); 
          FinanceStore.loadData(true); 
        })
        .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao salvar: " + (err.message || err), "error"))
        .apiSaveTransaction(payload);
    }
  }

  function promptDelete(id) {
    deletingId = id;
    document.getElementById("modalDelete").style.display = "flex";
  }

  function closeDeleteModal() {
    deletingId = null;
    document.getElementById("modalDelete").style.display = "none";
  }

  function confirmDelete() {
    if (!deletingId) return;
    google.script.run
      .withSuccessHandler(() => { 
        LocalCache.clearAll();
        closeDeleteModal(); 
        FinanceStore.loadData(true); 
        ContasController.load(true);
      })
      .withFailureHandler(err => showBusinessAlert("Erro", "Erro ao excluir: " + (err.message || err), "error"))
      .apiDeleteTransaction(deletingId);
  }
</script>
