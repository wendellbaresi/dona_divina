<section id="view-produtos" class="page-view">
  <!-- Barra de Pesquisa e Filtros -->
  <div style="margin-bottom: 20px;">
    <input 
      type="text" 
      id="searchProduto" 
      class="form-control" 
      placeholder="🔍 Buscar produto (ex: Espetinho, Coca-cola)..." 
      onkeyup="ProdutosController.filter()"
      style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 1rem;"
    >
  </div>

  <!-- Grid de Produtos -->
  <div id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding-bottom: 80px;">
    <!-- Os cards de produtos serão renderizados aqui dinamicamente -->
  </div>

  <!-- Barra Flutuante de Carrinho / Lista de Compras (Estilo App) -->
  <div id="cartBar" style="position: fixed; bottom: 20px; right: 30px; left: 280px; background: #0F172A; color: white; padding: 14px 24px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 1000; transition: all 0.3s ease;">
    <div>
      <span style="font-size: 0.85rem; color: #94A3B8;">Carrinho da Venda</span>
      <div style="font-size: 1.2rem; font-weight: bold; color: #2ECC71;" id="cartTotal">R$ 0,00</div>
    </div>
    <button class="btn btn-primary" style="background: #2ECC71; border: none; padding: 10px 20px; font-weight: bold;" onclick="ProdutosController.checkout()">
      🛒 Finalizar Venda (<span id="cartCount">0</span>)
    </button>
  </div>
</section>
