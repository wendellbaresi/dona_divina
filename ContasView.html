<section id="view-contas" class="page-view" style="display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
    <div>
      <h2>Contas e Despesas Fixas da Loja</h2>
      <p style="color: #64748B; font-size: 0.9rem; margin-top: 4px;">Monitoramento dedicado das contas de consumo e despesas mensais.</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <!-- Filtro por Mês -->
      <div style="display: flex; align-items: center; gap: 6px; background: white; padding: 4px 10px; border-radius: 8px; border: 1px solid #CBD5E1;">
        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Mês:</label>
        <select id="selectMesContas" class="form-control" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #CBD5E1; background: #fff; font-size: 0.85rem;" onchange="ContasController.load()">
          <option value="">Carregando...</option>
        </select>
      </div>

      <!-- Botão Adicionar Nova Conta -->
      <button type="button" class="btn btn-primary" onclick="openModalConta()" style="background: #A82329; border: none; padding: 9px 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">
        + Nova Conta
      </button>
    </div>
  </div>

  <div class="card table-container">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Categoria</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th style="text-align: center;">Ações</th>
        </tr>
      </thead>
      <tbody id="contasTableBody">
        <tr><td colspan="5" style="text-align: center;">Carregando contas da loja...</td></tr>
      </tbody>
    </table>
  </div>
</section>
